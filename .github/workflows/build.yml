name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cu: cu130
            tags: |
              ghcr.io/alesys/runpod-h3:latest
              ghcr.io/alesys/runpod-h3:cu130
          - cu: cu129
            tags: |
              ghcr.io/alesys/runpod-h3:cu129
    steps:
      # torch cu130 makes the image ~10 GB; the runner's default free disk is not enough.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TORCH_CU=${{ matrix.cu }}
          tags: |
            ${{ matrix.tags }}
            ghcr.io/alesys/runpod-h3:${{ matrix.cu }}-${{ github.sha }}
